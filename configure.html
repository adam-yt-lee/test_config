<script>
// ============================================
// Spec tags — render key specs as chips in modal + item cards
// ============================================
function buildSpecTags(sectionKey, opt) {
    const m = opt.meta || {};
    const tags = [];

    switch (sectionKey) {
        case 'cpu':
            if (m.cores)        tags.push(['cores',  `${m.cores}C / ${m.threads || 0}T`]);
            if (m.maxMemSpeed)  tags.push(['mem',    `Mem ${m.maxMemSpeed} MT/s`]);
            if (m.sramCache)    tags.push(['cache',  `Cache ${m.sramCache} MB`]);
            break;
        case 'dimm':
            if (m.freq)         tags.push(['speed',  `${m.freq} MT/s`]);
            if (m.density)      tags.push(['cap',    `${m.density} GB`]);
            break;
        case 'hdd':
            if (m.interface)    tags.push(['iface',  m.interface]);
            if (m.density)      tags.push(['cap',    `${m.density} TB`]);
            if (m.rpm)          tags.push(['rpm',    `${m.rpm} RPM`]);
            break;
        case 'ssd': {
            const ifLabel = m.pcieVersion ? `${m.interface} ${m.pcieVersion} x${m.pcieLane}` : m.interface;
            if (ifLabel)        tags.push(['iface',  ifLabel]);
            if (m.formFactor)   tags.push(['ff',     m.formFactor]);
            if (m.capacity)     tags.push(['cap',    `${m.capacity} GB`]);
            break;
        }
        case 'gpu':
            if (m.formFactor)   tags.push(['ff',     m.formFactor]);
            if (m.pcieVersion)  tags.push(['pcie',   `${m.pcieVersion} x${m.pcieLane}`]);
            break;
        case 'hba':
        case 'raid':
        case 'm2raid':
            if (m.pcieVersion)      tags.push(['pcie',  `${m.pcieVersion} x${m.pcieLane}`]);
            if (m.internalPorts > 0) tags.push(['ports', `${m.internalPorts}i`]);
            if (m.connector)        tags.push(['conn',  m.connector]);
            break;
        case 'nic':
            if (m.speedStr)     tags.push(['speed',  `${m.speedStr}G`]);
            if (m.ports)        tags.push(['ports',  `${m.ports}P`]);
            if (m.sfpType)      tags.push(['conn',   m.sfpType]);
            if (m.formFactor)   tags.push(['ff',     m.formFactor]);
            break;
        case 'transceiver':
            if (m.speed)        tags.push(['speed',  `${m.speed}G`]);
            if (m.interface)    tags.push(['conn',   m.interface]);
            if (m.mode)         tags.push(['mode',   m.mode]);
            break;
        case 'bbu':
            if (m.spec)         tags.push(['cache',  m.spec]);
            break;
    }

    if (!tags.length) return '';
    return `<div class="spec-tags">${tags.map(([cls, lbl]) =>
        `<span class="spec-tag spec-tag-${cls}">${lbl}</span>`
    ).join('')}</div>`;
}

// ============================================
// URL params
// ============================================
function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return { productId: params.get('product'), editIndex: params.get('edit') !== null ? parseInt(params.get('edit')) : -1 };
}

// ============================================
// Modal State
// ============================================
let currentModalUID = null;

// ============================================
// Initialize
// ============================================
function initConfigure() {
    updateCartBadge();
    const { productId, editIndex } = getUrlParams();
    if (!productId) { window.location.href = 'index.html'; return; }

    selectedProduct = products.find(p => p.id === productId);
    if (!selectedProduct) { window.location.href = 'index.html'; return; }

    activeNodeConfigs = selectedProduct.nodes.map((nodeSpec, idx) => {
        // Clone nodeSpec so we can mutate pcieSlots/frontDiskSlots per active scheme
        const ns = {
            ...nodeSpec,
            pcieSlots: [...(nodeSpec.pcieSlots || [])],
            frontDiskSlots: { ...(nodeSpec.frontDiskSlots || {}) },
            rearDiskSlots:  { ...(nodeSpec.rearDiskSlots  || {}) },
        };
        return {
            nodeIdx: idx,
            nodeId: nodeSpec.nodeId,
            nodeSpec: ns,
            qty: nodeSpec.defaultQty,
            sections: createConfigSections(selectedProduct, ns),
            activePcieSchemeIdx: 0,
            activeFrontDiskSchemeIdx: 0,
            activeRearDiskSchemeIdx: 0,
        };
    });

    if (editIndex >= 0 && cartItems[editIndex]) {
        editingCartIndex = editIndex;
        const saved = cartItems[editIndex];
        if (selectedProduct.isMultiNode && Array.isArray(saved.config)) {
            saved.config.forEach((nodeConfig, i) => {
                if (activeNodeConfigs[i]) {
                    if (saved.nodeQty && saved.nodeQty[i]) activeNodeConfigs[i].qty = saved.nodeQty[i];
                    activeNodeConfigs[i].sections.forEach(s => {
                        if (nodeConfig[s.key]) s.loadSelections(nodeConfig[s.key]);
                    });
                }
            });
        } else if (!selectedProduct.isMultiNode && saved.config) {
            activeNodeConfigs[0].sections.forEach(s => {
                if (saved.config[s.key]) s.loadSelections(saved.config[s.key]);
            });
        }
    } else {
        editingCartIndex = -1;
    }

    document.getElementById('config-toolbar-title').textContent = 'Configure: ' + productId;
    renderConfigPage();
}

// ============================================
// Render the full configure page (tabbed layout)
// ============================================
function renderConfigPage() {
    const content = document.getElementById('config-content');
    const lm = buildLabelMap();
    const p = selectedProduct;

    const gpuBadge = p.gpus > 0
        ? `<span class="result-badge gpu">${p.gpus}\u00d7 ${p.gpuType.map(g => getLabel(lm,'gpuType',g)).join(' / ')}</span>`
        : `<span class="result-badge">No GPU</span>`;

    let html = `<div class="config-summary-card">
        <div class="config-summary-name">${p.id}</div>
        <div class="config-summary-badges">
            <span class="result-badge platform">${getLabel(lm,'platform',p.platform)}</span>
            <span class="result-badge vendor">${getLabel(lm,'cpuVendor',p.cpuVendor)}</span>
            <span class="result-badge form-factor">${getLabel(lm,'formFactor',p.formFactor)}</span>
            <span class="result-badge cooling">${getLabel(lm,'cooling',p.cooling)}</span>
            ${gpuBadge}
        </div>
        <div class="config-summary-detail">
            CPU: ${p.cpuSeries.toUpperCase()} \u00d7${p.cpuSockets} &middot;
            ${p.dimmSlots} ${p.dimmType} slots &middot;
            ${p.nodeCount > 1 ? p.nodeCount + ' nodes' : 'Single node'}
        </div>
    </div>`;

    // Node qty row (multi-node)
    if (p.isMultiNode) {
        html += `<div class="node-config-header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20 6h-2.18c.07-.44.18-.86.18-1.3 0-2.6-2.1-4.7-4.7-4.7-1.54 0-2.95.74-3.84 1.9L8 3.64C7.09 2.5 5.71 1.7 4.1 1.7 1.5 1.7 0 3.8 0 6.4c0 .6.11 1.17.26 1.6H0v14h24V8h-4V6zm-8-3.3c1.49 0 2.7 1.21 2.7 2.7 0 .44-.11.86-.28 1.3H12v-1.3c0-1.49 0-2.7 0-2.7zM2.18 6.4C2.18 5 3.4 3.8 4.8 3.8c.9 0 1.65.47 2.1 1.14L8 6.7H2.27c-.06-.1-.09-.2-.09-.3zM22 22H2V10h20v12z"/></svg>
            Node 設定 (多節點機種)
        </div>
        <div class="node-qty-row">`;
        activeNodeConfigs.forEach(nc => {
            const label = nc.nodeId ? `Node ${nc.nodeId}` : 'All Nodes';
            html += `<div class="node-qty-item">
                <span class="node-qty-label">${label}</span>
                <div class="node-qty-ctrl">
                    <button onclick="changeNodeQty(${nc.nodeIdx}, -1)">&#8722;</button>
                    <input type="number" id="qty-node-${nc.nodeIdx}" value="${nc.qty}" min="1"
                        onchange="setNodeQty(${nc.nodeIdx}, this.value)">
                    <button onclick="changeNodeQty(${nc.nodeIdx}, 1)">&#43;</button>
                </div>
                <span class="node-qty-unit">nodes</span>
            </div>`;
        });
        html += `</div>`;
    }

    // Per-node config area (tabs + selected items)
    activeNodeConfigs.forEach(nc => {
        const nodeLabel = nc.nodeId ? `Node ${nc.nodeId}` : null;
        if (p.isMultiNode && nodeLabel) {
            html += `<div class="node-section-header" id="node-block-${nc.nodeIdx}">
                <span class="node-label">${nodeLabel}</span>
                <span class="node-slot-info">${nc.nodeSpec.pcieSlots.length} PCIe slot(s)</span>
            </div>`;
        }
        html += `<div class="node-config-area">
            <div id="scheme-sel-${nc.nodeIdx}">${renderSchemeSelectorsHTML(nc)}</div>
            <div class="section-tabs-bar" id="tabs-bar-${nc.nodeIdx}">
                ${renderSectionTabsHTML(nc)}
            </div>
            <div class="selected-items-area" id="selected-area-${nc.nodeIdx}">
                ${renderSelectedItemsHTML(nc)}
            </div>
        </div>`;
    });

    html += `<div id="pcie-slot-panel"></div>`;
    html += `<div id="conflict-warnings-panel"></div>`;

    content.innerHTML = html;
    renderPcieSlotPanel();
    renderConflictWarnings();
}

// ============================================
// Render section tabs bar HTML
// ============================================
function renderSectionTabsHTML(nc) {
    return nc.sections.map(section => {
        const uid = makeUID(nc.nodeIdx, section.key);
        const count = Object.keys(section.selections).length;
        const typeClass = { single: 'tab-required', multi: 'tab-multi', optional: 'tab-optional' }[section.type] || '';
        const isBlocked = isTabDependencyBlocked(uid, section, nc);
        return `<button class="section-tab ${count > 0 ? 'tab-has-selection' : ''} ${typeClass} ${isBlocked ? 'tab-blocked' : ''}"
                        onclick="openSectionModal('${uid}')"
                        title="${section.name}${isBlocked ? ' (請先選擇依賴項目)' : ''}">
            <span class="tab-name">${section.name}</span>
            ${count > 0 ? `<span class="tab-count">${count}</span>` : ''}
            ${section.type !== 'optional' && count === 0 ? `<span class="tab-dot tab-dot-empty"></span>` : ''}
            ${section.type !== 'optional' && count > 0 ? `<span class="tab-dot tab-dot-filled"></span>` : ''}
        </button>`;
    }).join('');
}

function isTabDependencyBlocked(uid, section, nc) {
    if (!section.dependsOn) return false;
    if (section.dependsOn === 'disk') {
        if (section.key === 'raid') return !hasNonM2DiskSelected(nc);
        if (section.key === 'm2raid') return !hasM2SSDSelected(nc);
    }
    if (section.dependsOn === 'nic') {
        const nicSec = nc.sections.find(s => s.key === 'nic');
        return !nicSec || Object.keys(nicSec.selections).length === 0;
    }
    if (section.dependsOn === 'raid') {
        const raidSec = nc.sections.find(s => s.key === 'raid');
        return !raidSec || Object.keys(raidSec.selections).length === 0;
    }
    return false;
}

// ============================================
// Render selected items HTML
// ============================================
function renderSelectedItemsHTML(nc) {
    function getItems(key) {
        const sec = nc.sections.find(s => s.key === key);
        if (!sec) return [];
        return Object.entries(sec.selections).map(([optId, qty]) => {
            const opt = sec.options.find(o => o.id === optId);
            return opt ? { section: sec, opt, qty, uid: makeUID(nc.nodeIdx, key) } : null;
        }).filter(Boolean);
    }

    function getSSDItems(m2Only) {
        const sec = nc.sections.find(s => s.key === 'ssd');
        if (!sec) return [];
        return Object.entries(sec.selections).map(([optId, qty]) => {
            const opt = sec.options.find(o => o.id === optId);
            if (!opt) return null;
            if (m2Only && !opt.meta.isM2) return null;
            if (!m2Only && opt.meta.isM2) return null;
            return { section: sec, opt, qty, uid: makeUID(nc.nodeIdx, 'ssd') };
        }).filter(Boolean);
    }

    const cpuItems  = getItems('cpu');
    const dimmItems = getItems('dimm');
    const gpuItems  = getItems('gpu');
    const hbaItems  = getItems('hba');
    const hddItems  = getItems('hdd');
    const stdSSDItems = getSSDItems(false);
    const m2SSDItems  = getSSDItems(true);
    const nicItems  = getItems('nic');
    const raidItems = getItems('raid');
    const m2raidItems = getItems('m2raid');
    const bbuItems  = getItems('bbu');
    const transItems = getItems('transceiver');

    const totalCount = cpuItems.length + dimmItems.length + gpuItems.length + hbaItems.length +
        hddItems.length + stdSSDItems.length + m2SSDItems.length + nicItems.length +
        raidItems.length + m2raidItems.length + bbuItems.length + transItems.length;

    if (totalCount === 0) {
        return `<div class="selected-empty">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="currentColor" style="opacity:0.2">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <p>點選上方選項卡新增配件</p>
        </div>`;
    }

    // Decide grouping
    const hasStorageDisk = hddItems.length > 0 || stdSSDItems.length > 0;
    const hasStorageDep  = raidItems.length > 0 || bbuItems.length > 0;
    const doStorageGroup = hasStorageDisk && hasStorageDep;

    const doM2Group = m2SSDItems.length > 0 && m2raidItems.length > 0;
    const doNetGroup = nicItems.length > 0 && transItems.length > 0;

    function renderGroup(items, label, forceGroup) {
        if (!items.length) return '';
        if (forceGroup) {
            return `<div class="related-group">
                <div class="related-group-label">${label}</div>
                ${items.map(renderItemCard).join('')}
            </div>`;
        }
        return items.map(renderItemCard).join('');
    }

    let html = '<div class="selected-items-list">';

    // Standalone
    [...cpuItems, ...dimmItems, ...gpuItems, ...hbaItems].forEach(item => {
        html += renderItemCard(item);
    });

    // Storage group
    const storageAll = [...hddItems, ...stdSSDItems, ...raidItems, ...bbuItems];
    if (doStorageGroup) {
        html += `<div class="related-group">
            <div class="related-group-label">Storage</div>
            ${storageAll.map(renderItemCard).join('')}
        </div>`;
    } else {
        storageAll.forEach(item => { html += renderItemCard(item); });
    }

    // M.2 group
    const m2All = [...m2SSDItems, ...m2raidItems];
    if (doM2Group) {
        html += `<div class="related-group">
            <div class="related-group-label">M.2 Storage</div>
            ${m2All.map(renderItemCard).join('')}
        </div>`;
    } else {
        m2All.forEach(item => { html += renderItemCard(item); });
    }

    // Networking group
    const netAll = [...nicItems, ...transItems];
    if (doNetGroup) {
        html += `<div class="related-group">
            <div class="related-group-label">Networking</div>
            ${netAll.map(renderItemCard).join('')}
        </div>`;
    } else {
        netAll.forEach(item => { html += renderItemCard(item); });
    }

    html += '</div>';
    return html;
}

function renderItemCard({ section, opt, qty, uid }) {
    const isMulti = section.type !== 'single' || section.showQtyCtrl;
    const safeId = (uid + '_' + opt.id).replace(/[^a-z0-9]/gi, '_');
    const typeColors = { cpu:'#dcfce7', dimm:'#dcfce7', gpu:'#dbeafe', hdd:'#fef9c3', ssd:'#fef9c3',
                         nic:'#ede9fe', hba:'#ede9fe', raid:'#fee2e2', m2raid:'#fee2e2',
                         bbu:'#ffedd5', transceiver:'#ede9fe' };
    const sectionColor = typeColors[section.key] || '#f1f5f9';
    const optIdEsc = opt.id.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

    return `<div class="selected-item-card" id="scard-${safeId}">
        <div class="sic-top">
            <span class="sic-section-badge" style="background:${sectionColor}">${section.name}</span>
            <button class="sic-remove-btn" onclick="removeSelectedItem('${uid}', '${optIdEsc}')" title="移除">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div class="sic-name" title="${opt.name}">${opt.name}</div>
        <div class="sic-mpn">MPN: ${opt.id}</div>
        ${buildSpecTags(section.key, opt)}
        <div class="sic-bottom">
            ${isMulti
                ? `<div class="sic-qty-ctrl">
                    <button onclick="adjustSelectedQty('${uid}', '${optIdEsc}', -1)">−</button>
                    <span id="siq-${safeId}">${qty}</span>
                    <button onclick="adjustSelectedQty('${uid}', '${optIdEsc}', 1)">+</button>
                   </div>`
                : `<span class="sic-qty-label">Qty: ${qty}</span>`}
        </div>
    </div>`;
}

// ============================================
// Scheme selector helpers
// ============================================
function schemeSlotLabel(slots) {
    const counts = {};
    slots.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
    return Object.entries(counts).map(([t, c]) => c > 1 ? `${t}×${c}` : t).join(' + ') || '(empty)';
}

function diskSchemeLabel(map) {
    const entries = Object.entries(map || {});
    if (!entries.length) return '(none)';
    return entries.map(([t, c]) => `${c}× ${t}`).join(' + ');
}

function renderSchemeSelectorsHTML(nc) {
    const ns = nc.nodeSpec;
    let html = '';

    // PCIe scheme selector (only if >1 scheme)
    if (ns.pcieSlotSchemes && ns.pcieSlotSchemes.length > 1) {
        html += `<div class="scheme-selector">
            <span class="scheme-selector-label">PCIe Layout:</span>
            <div class="scheme-btn-group">`;
        ns.pcieSlotSchemes.forEach((scheme, idx) => {
            const active = idx === nc.activePcieSchemeIdx;
            const label = schemeSlotLabel(scheme.slots);
            html += `<button class="scheme-btn ${active ? 'scheme-btn-active' : ''}"
                title="${scheme.label}"
                onclick="changePcieScheme(${nc.nodeIdx}, ${idx})">
                <span class="scheme-btn-idx">Config ${idx + 1}</span>
                <span class="scheme-btn-detail">${ns.pcieSlotSchemes[idx].slots.length} slots</span>
            </button>`;
        });
        html += `</div></div>`;
    }

    // Front disk scheme selector (only if >1 scheme)
    if (ns.frontDiskSchemes && ns.frontDiskSchemes.length > 1) {
        html += `<div class="scheme-selector">
            <span class="scheme-selector-label">Front Bays:</span>
            <div class="scheme-btn-group">`;
        ns.frontDiskSchemes.forEach((scheme, idx) => {
            const active = idx === nc.activeFrontDiskSchemeIdx;
            const label = diskSchemeLabel(scheme.map);
            html += `<button class="scheme-btn ${active ? 'scheme-btn-active' : ''}"
                title="${scheme.label}"
                onclick="changeDiskScheme(${nc.nodeIdx}, 'front', ${idx})">
                ${label}
            </button>`;
        });
        html += `</div></div>`;
    }

    // Rear disk scheme selector (only if >1 scheme)
    if (ns.rearDiskSchemes && ns.rearDiskSchemes.length > 1) {
        html += `<div class="scheme-selector">
            <span class="scheme-selector-label">Rear Bays:</span>
            <div class="scheme-btn-group">`;
        ns.rearDiskSchemes.forEach((scheme, idx) => {
            const active = idx === nc.activeRearDiskSchemeIdx;
            const label = diskSchemeLabel(scheme.map);
            html += `<button class="scheme-btn ${active ? 'scheme-btn-active' : ''}"
                title="${scheme.label}"
                onclick="changeDiskScheme(${nc.nodeIdx}, 'rear', ${idx})">
                ${label}
            </button>`;
        });
        html += `</div></div>`;
    }

    return html ? `<div class="scheme-selectors-row">${html}</div>` : '';
}

function changePcieScheme(nodeIdx, schemeIdx) {
    const nc = activeNodeConfigs[nodeIdx];
    if (!nc) return;
    nc.activePcieSchemeIdx = schemeIdx;
    const scheme = nc.nodeSpec.pcieSlotSchemes && nc.nodeSpec.pcieSlotSchemes[schemeIdx];
    if (scheme) nc.nodeSpec.pcieSlots = scheme.slots;
    const el = document.getElementById('scheme-sel-' + nodeIdx);
    if (el) el.innerHTML = renderSchemeSelectorsHTML(nc);
    renderPcieSlotPanel();
    renderConflictWarnings();
}

function changeDiskScheme(nodeIdx, type, schemeIdx) {
    const nc = activeNodeConfigs[nodeIdx];
    if (!nc) return;
    if (type === 'front') {
        nc.activeFrontDiskSchemeIdx = schemeIdx;
        const scheme = nc.nodeSpec.frontDiskSchemes && nc.nodeSpec.frontDiskSchemes[schemeIdx];
        if (scheme) nc.nodeSpec.frontDiskSlots = scheme.map;
    } else if (type === 'rear') {
        nc.activeRearDiskSchemeIdx = schemeIdx;
        const scheme = nc.nodeSpec.rearDiskSchemes && nc.nodeSpec.rearDiskSchemes[schemeIdx];
        if (scheme) nc.nodeSpec.rearDiskSlots = scheme.map;
    }
    const el = document.getElementById('scheme-sel-' + nodeIdx);
    if (el) el.innerHTML = renderSchemeSelectorsHTML(nc);
    renderConflictWarnings();
}

// ============================================
// Refresh a node's tabs + selected area
// ============================================
function refreshNodeUI(nodeIdx) {
    const nc = activeNodeConfigs[nodeIdx];
    if (!nc) return;
    const tabsEl = document.getElementById('tabs-bar-' + nodeIdx);
    const areaEl = document.getElementById('selected-area-' + nodeIdx);
    if (tabsEl) tabsEl.innerHTML = renderSectionTabsHTML(nc);
    if (areaEl) areaEl.innerHTML = renderSelectedItemsHTML(nc);
    renderPcieSlotPanel();
    renderConflictWarnings();
}

// ============================================
// Open section modal
// ============================================
function openSectionModal(uid) {
    const section = findSectionByUID(uid);
    if (!section) return;
    currentModalUID = uid;

    // Build brand/subgroup options
    const brands    = [...new Set(section.options.map(o => o.brand))].filter(Boolean).sort();
    const subgroups = [...new Set(section.options.map(o => o.subGroup))].filter(Boolean).sort();
    document.getElementById('modal-brand').innerHTML =
        '<option value="">All Brands</option>' + brands.map(b => `<option value="${b}">${b}</option>`).join('');
    document.getElementById('modal-subgroup').innerHTML =
        '<option value="">All Groups</option>' + subgroups.map(s => `<option value="${s}">${s}</option>`).join('');
    document.getElementById('modal-search').value = '';
    document.getElementById('modal-title').textContent = 'Select: ' + section.name;

    // Dependency check
    const depMsg = getModalDepMsg(uid, section);
    const depEl = document.getElementById('modal-dep-warning');
    if (depMsg) {
        depEl.innerHTML = `<div class="dep-hint">${depMsg}</div>`;
        depEl.style.display = 'block';
        document.getElementById('modal-options-list').innerHTML = '';
    } else {
        depEl.style.display = 'none';
        updateModalOptions();
    }

    updateModalSelectionHint();
    document.getElementById('section-modal').style.display = 'flex';
}

function getModalDepMsg(uid, section) {
    if (!section.dependsOn) return null;
    const parsed = parseSectionUID(uid);
    const nc = activeNodeConfigs[parsed.nodeIdx];
    if (!nc) return null;

    if (section.dependsOn === 'disk') {
        if (section.key === 'raid' && !hasNonM2DiskSelected(nc))
            return '⚠ 請先選擇硬碟 (HDD 或非 M.2 SSD)，再設定 RAID。<br><small>注意：RAID 不能與 M.2 SSD 建立關聯。</small>';
        if (section.key === 'm2raid' && !hasM2SSDSelected(nc))
            return '⚠ 請先選擇 M.2 SSD，再設定 M.2 RAID。<br><small>M.2 RAID 只能與 M.2 SSD 建立關聯。</small>';
    }
    if (section.dependsOn === 'nic') {
        const nicSec = nc.sections.find(s => s.key === 'nic');
        if (!nicSec || !Object.keys(nicSec.selections).length)
            return '⚠ 請先選擇 NIC Card，再選擇 Transceiver。';
    }
    if (section.dependsOn === 'raid') {
        const raidSec = nc.sections.find(s => s.key === 'raid');
        if (!raidSec || !Object.keys(raidSec.selections).length)
            return '⚠ 請先選擇 RAID Card，再選擇 BBU。';
    }
    return null;
}

function hasNonM2DiskSelected(nc) {
    const hddSec = nc.sections.find(s => s.key === 'hdd');
    if (hddSec && Object.keys(hddSec.selections).length > 0) return true;
    const ssdSec = nc.sections.find(s => s.key === 'ssd');
    if (ssdSec) {
        for (const optId of Object.keys(ssdSec.selections)) {
            const opt = ssdSec.options.find(o => o.id === optId);
            if (opt && !opt.meta.isM2) return true;
        }
    }
    return false;
}

function hasM2SSDSelected(nc) {
    const ssdSec = nc.sections.find(s => s.key === 'ssd');
    if (!ssdSec) return false;
    for (const optId of Object.keys(ssdSec.selections)) {
        const opt = ssdSec.options.find(o => o.id === optId);
        if (opt && opt.meta.isM2) return true;
    }
    return false;
}

// ============================================
// Modal: update filtered option list
// ============================================
function updateModalOptions() {
    if (!currentModalUID) return;
    const section = findSectionByUID(currentModalUID);
    if (!section) return;

    const brand  = document.getElementById('modal-brand').value;
    const sg     = document.getElementById('modal-subgroup').value;
    const search = document.getElementById('modal-search').value.trim().toLowerCase();

    let opts = section.options;
    if (brand)  opts = opts.filter(o => o.brand === brand);
    if (sg)     opts = opts.filter(o => o.subGroup === sg);
    if (search) opts = opts.filter(o =>
        o.id.toLowerCase().includes(search) ||
        o.name.toLowerCase().includes(search) ||
        (o.desc || '').toLowerCase().includes(search)
    );

    const listEl = document.getElementById('modal-options-list');
    if (!opts.length) {
        listEl.innerHTML = '<div class="panel-empty">No matching options found.</div>';
        return;
    }

    const uid = currentModalUID;
    const isMulti = section.type !== 'single' || section.showQtyCtrl;

    listEl.innerHTML = opts.map(opt => {
        const isSelected = section.selections[opt.id] !== undefined;
        const qty = isSelected ? section.selections[opt.id] : 1;
        const safeId = opt.id.replace(/[^a-z0-9]/gi, '_');
        const optIdEsc = opt.id.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

        return `<div class="modal-option ${isSelected ? 'mopt-selected' : ''}"
                     id="mopt-${safeId}"
                     onclick="modalToggleOption('${uid}', '${optIdEsc}')">
            <div class="mopt-check">
                ${isSelected
                    ? `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="8" fill="none"><path fill="#fff" fill-rule="evenodd" d="M9.218.304a1 1 0 0 1-.022 1.414l-5.187 5a1 1 0 0 1-1.393 0L.804 4.99a1 1 0 0 1 1.392-1.436l1.117 1.052L7.803.282a1 1 0 0 1 1.415.022" clip-rule="evenodd"/></svg>`
                    : ''}
            </div>
            <div class="mopt-text">
                <div class="mopt-name">${opt.name}</div>
                ${buildSpecTags(section.key, opt)}
                <div class="mopt-mpn">MPN: ${opt.id}</div>
            </div>
            ${isSelected && isMulti
                ? `<div class="mopt-qty" onclick="event.stopPropagation()">
                    <button onclick="modalAdjustQty('${uid}', '${optIdEsc}', -1)">−</button>
                    <span id="mq-${safeId}">${qty}</span>
                    <button onclick="modalAdjustQty('${uid}', '${optIdEsc}', 1)">+</button>
                   </div>`
                : ''}
        </div>`;
    }).join('');

    updateModalSelectionHint();
}

function modalToggleOption(uid, optId) {
    const section = findSectionByUID(uid);
    if (!section) return;
    section.select(optId);
    updateModalOptions();
    const parsed = parseSectionUID(uid);
    if (parsed) refreshNodeUI(parsed.nodeIdx);
}

function modalAdjustQty(uid, optId, delta) {
    const section = findSectionByUID(uid);
    if (!section || section.selections[optId] === undefined) return;
    section.setQty(optId, section.selections[optId] + delta);
    const safeId = optId.replace(/[^a-z0-9]/gi, '_');
    const el = document.getElementById('mq-' + safeId);
    if (el) el.textContent = section.selections[optId];
    const parsed = parseSectionUID(uid);
    if (parsed) refreshNodeUI(parsed.nodeIdx);
}

function updateModalSelectionHint() {
    if (!currentModalUID) return;
    const section = findSectionByUID(currentModalUID);
    if (!section) return;
    const count = Object.keys(section.selections).length;
    const hintEl = document.getElementById('modal-selection-hint');
    if (hintEl) hintEl.textContent = count > 0 ? `已選 ${count} 項` : '';
}

function closeModal() {
    document.getElementById('section-modal').style.display = 'none';
    currentModalUID = null;
}

function handleModalOverlayClick(event) {
    if (event.target === document.getElementById('section-modal')) closeModal();
}

// ============================================
// Selected item controls
// ============================================
function removeSelectedItem(uid, optId) {
    const section = findSectionByUID(uid);
    if (!section) return;
    delete section.selections[optId];
    const parsed = parseSectionUID(uid);
    if (parsed) refreshNodeUI(parsed.nodeIdx);
}

function adjustSelectedQty(uid, optId, delta) {
    const section = findSectionByUID(uid);
    if (!section || section.selections[optId] === undefined) return;
    section.setQty(optId, section.selections[optId] + delta);
    const parsed = parseSectionUID(uid);
    if (!parsed) return;
    const nc = activeNodeConfigs[parsed.nodeIdx];
    if (!nc) return;
    const safeId = (uid + '_' + optId).replace(/[^a-z0-9]/gi, '_');
    const el = document.getElementById('siq-' + safeId);
    if (el) el.textContent = section.selections[optId];
    renderPcieSlotPanel();
    renderConflictWarnings();
}

// ============================================
// Node qty controls
// ============================================
function changeNodeQty(nodeIdx, delta) {
    const nc = activeNodeConfigs[nodeIdx];
    if (!nc) return;
    nc.qty = Math.max(1, nc.qty + delta);
    const el = document.getElementById('qty-node-' + nodeIdx);
    if (el) el.value = nc.qty;
}

function setNodeQty(nodeIdx, value) {
    const nc = activeNodeConfigs[nodeIdx];
    if (!nc) return;
    nc.qty = Math.max(1, parseInt(value) || 1);
}

// ============================================
// PCIe slot panel
// ============================================
function renderPcieSlotPanel() {
    const panel = document.getElementById('pcie-slot-panel');
    if (!panel || !selectedProduct) return;

    let allWarnings = [];
    let allSlots    = [];
    let totalCards  = 0;
    let totalSlots  = 0;

    activeNodeConfigs.forEach(nc => {
        const result = validatePcieSlots(selectedProduct, nc.nodeSpec, nc.sections);
        allWarnings = allWarnings.concat(result.warnings);
        allSlots = allSlots.concat(result.slotStatus.map(s => ({ ...s, nodeLabel: nc.nodeId ? `Node ${nc.nodeId}` : '' })));
        totalCards += result.totalCards;
        totalSlots += result.totalSlots;
    });

    const hasWarnings = allWarnings.length > 0;
    let html = `<div class="pcie-slot-section ${hasWarnings ? 'pcie-has-warnings' : ''}">
        <div class="pcie-slot-header">
            <span class="pcie-slot-title">PCIe Slot Usage</span>
            <span class="pcie-slot-count">${totalCards} / ${totalSlots} slots used</span>
        </div>`;
    if (hasWarnings) {
        html += `<div class="pcie-warnings">`;
        allWarnings.forEach(w => {
            html += `<div class="pcie-warning-item">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                ${w}</div>`;
        });
        html += `</div>`;
    }
    html += `<div class="pcie-slot-grid">`;
    allSlots.forEach(slot => {
        const occupied = slot.assigned !== null;
        const statusClass = occupied ? 'pcie-slot-occupied' : 'pcie-slot-empty';
        html += `<div class="pcie-slot-item ${statusClass}">
            <div class="pcie-slot-type">${slot.type}${slot.nodeLabel ? ' [' + slot.nodeLabel + ']' : ''}</div>
            <div class="pcie-slot-label">${occupied ? slot.assigned.name : 'Empty'}</div>
        </div>`;
    });
    html += `</div></div>`;
    panel.innerHTML = html;
}

// ============================================
// Conflict warnings panel
// ============================================
function renderConflictWarnings() {
    const panel = document.getElementById('conflict-warnings-panel');
    if (!panel) return;
    let allWarnings = [];
    activeNodeConfigs.forEach(nc => {
        const w = checkSpecConflicts(selectedProduct, nc.sections);
        allWarnings = allWarnings.concat(w);
    });
    if (!allWarnings.length) { panel.innerHTML = ''; return; }
    let html = `<div class="conflict-warnings-section">
        <div class="conflict-title">\u26a0 規格衝突警告</div>`;
    allWarnings.forEach(w => { html += `<div class="conflict-item">${w}</div>`; });
    html += `</div>`;
    panel.innerHTML = html;
}

// ============================================
// Cart Actions
// ============================================
function cancelConfig() {
    editingCartIndex = -1;
    activeNodeConfigs = [];
    selectedProduct = null;
    window.location.href = 'index.html';
}

function saveDraft() {
    if (!selectedProduct) return;
    const item = _buildCartItem('draft');
    if (editingCartIndex >= 0) cartItems[editingCartIndex] = item;
    else cartItems.push(item);
    persistCart();
    editingCartIndex = -1;
    window.location.href = 'index.html';
}

function submitConfig() {
    if (!selectedProduct) return;
    for (const nc of activeNodeConfigs) {
        for (const s of nc.sections) {
            if (!s.isValid()) {
                alert('Please complete all required selections (CPU, DIMM) before submitting.');
                return;
            }
        }
    }
    let pcieOk = true;
    activeNodeConfigs.forEach(nc => {
        const r = validatePcieSlots(selectedProduct, nc.nodeSpec, nc.sections);
        if (r.unassigned.length > 0) {
            alert('PCIe slot conflict: not enough slots for: ' + r.unassigned.map(c => c.name).join(', '));
            pcieOk = false;
        }
    });
    if (!pcieOk) return;

    const item = _buildCartItem('confirmed');
    if (editingCartIndex >= 0) cartItems[editingCartIndex] = item;
    else cartItems.push(item);
    persistCart();
    editingCartIndex = -1;
    window.location.href = 'cart.html';
}

function _buildCartItem(status) {
    if (selectedProduct.isMultiNode) {
        return {
            productId: selectedProduct.id,
            nodeQty: activeNodeConfigs.map(nc => nc.qty),
            config: activeNodeConfigs.map(nc => {
                const cfg = {};
                nc.sections.forEach(s => { cfg[s.key] = s.getSelections(); });
                return cfg;
            }),
            status, timestamp: new Date().toISOString(),
        };
    } else {
        const config = {};
        activeNodeConfigs[0].sections.forEach(s => { config[s.key] = s.getSelections(); });
        return { productId: selectedProduct.id, config, status, timestamp: new Date().toISOString() };
    }
}

// ============================================
// Start
// ============================================
loadData(initConfigure);
</script>
