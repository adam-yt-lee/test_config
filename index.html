// ============================================
// XLSX Parsing (unchanged)
// ============================================
function parseXLSX(arrayBuffer) {
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];
    return XLSX.utils.sheet_to_json(sheet, { defval: '' });
}

function parseProductsXLSX(arrayBuffer) {
    const rows = parseXLSX(arrayBuffer);
    return rows.map(row => ({
        id: String(row.id || ''),
        platform: String(row.platform || ''),
        cooling: String(row.cooling || ''),
        vendor: String(row.vendor || ''),
        cpuSeries: String(row.cpuSeries || ''),
        formFactor: String(row.formFactor || ''),
        gpuType: String(row.gpuType || ''),
        gpus: parseInt(row.gpus, 10) || 0,
        dimmSlots: parseInt(row.dimmSlots, 10) || 0,
        lanSpeed: String(row.lanSpeed || ''),
        application: row.application ? String(row.application).split('|') : []
    }));
}

function parseFiltersXLSX(arrayBuffer) {
    const rows = parseXLSX(arrayBuffer);
    const categoryMap = new Map();
    rows.forEach(row => {
        const key = String(row.category_key || '');
        if (!categoryMap.has(key)) {
            categoryMap.set(key, { key, name: String(row.category_name || ''), options: [] });
        }
        categoryMap.get(key).options.push({ value: String(row.option_value || ''), label: String(row.option_label || '') });
    });
    return Array.from(categoryMap.values());
}

async function loadData() {
    const [productsResp, filtersResp] = await Promise.all([fetch('products.xlsx'), fetch('filters.xlsx')]);
    products = parseProductsXLSX(await productsResp.arrayBuffer());
    filterCategories = parseFiltersXLSX(await filtersResp.arrayBuffer());
    init();
}

// ============================================
// Initialize
// ============================================

    document.getElementById('total-count').textContent = products.length;

}

// ============================================
// Page Navigation (inline style switching)
// ============================================
function navigateTo(page) {
    document.getElementById('page-main').style.display = 'none';
    document.getElementById('page-configure').style.display = 'none';
    document.getElementById('page-cart').style.display = 'none';

    if (page === 'main') {
        document.getElementById('page-main').style.display = 'flex';
    } else if (page === 'configure') {
        document.getElementById('page-configure').style.display = 'flex';
    } else if (page === 'cart') {
        document.getElementById('page-cart').style.display = 'flex';
    }
}

function showCart() {
    renderCart();
    navigateTo('cart');
}

function openConfigurator(productId, cartIndex) {
    selectedProduct = products.find(p => p.id === productId);
    if (!selectedProduct) return;

    if (typeof cartIndex === 'number' && cartIndex >= 0) {
        editingCartIndex = cartIndex;
        currentConfig = { ...cartItems[cartIndex].config };
    } else {
        editingCartIndex = -1;
        currentConfig = { cpu: '', dimm: '', lanCard: '', raidCard: '' };
    }

    document.getElementById('config-toolbar-title').textContent = 'Configure: ' + productId;
    renderConfigPage();
    navigateTo('configure');
}

// ============================================
// Render Filter Categories (unchanged)
// ============================================
function renderFilterCategories() {
    const container = document.getElementById('filter-option-container');
    container.innerHTML = '';

    filterCategories.forEach(category => {
        const categoryEl = document.createElement('div');
        categoryEl.className = 'product-filter-category';
        categoryEl.dataset.filterKey = category.key;

        const titleEl = document.createElement('div');
        titleEl.className = 'product-category-title';
        titleEl.onclick = function() { toggleFilter(this); };
        titleEl.innerHTML = `
            <span class="product-category-name">${category.name}<span class="filter-count-badge" id="badge-${category.key}" style="display:none;">0</span></span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="filter-icon">
                <path d="M2.29 7.29a.996.996 0 0 1 1.41 0l8.29 8.29 8.29-8.29a.996.996 0 1 1 1.41 1.41l-9 9a.996.996 0 0 1-1.41 0L2.29 8.71a.996.996 0 0 1 0-1.41Z" style="fill-rule: evenodd;"></path>
            </svg>
        `;
        categoryEl.appendChild(titleEl);

        const subMenu = document.createElement('ul');
        subMenu.className = 'product-sub-menu';
        subMenu.dataset.filterKey = category.key;

        category.options.forEach(option => {
            const li = document.createElement('li');
            li.className = 'product-filter-item';
            li.dataset.filterKey = category.key;
            li.dataset.filterValue = option.value;
            li.innerHTML = `
                <div class="gbt-checkbox-wrapper">
                    <label class="gbt-main-checkbox-label" style="gap:8px;">
                        <div class="gbt-main-checkbox-container">
                            <input type="checkbox" class="gbt-main-checkbox" name="${category.key}" value="${option.value}" onchange="onFilterChange(this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" fill="none" style="pointer-events:none;" class="gbt-main-checkbox-check">
                                <path fill="#fff" fill-rule="evenodd" d="M11.218.304a1 1 0 0 1-.022 1.414l-6.187 6a1 1 0 0 1-1.393 0L.804 4.99a1 1 0 0 1 1.392-1.436l2.117 2.052L9.803.282a1 1 0 0 1 1.415.022" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <span class="gbt-main-checkbox-label-text">${option.label}</span>
                        <span class="option-count" id="count-${category.key}-${option.value}"></span>
                    </label>
                </div>
            `;
            subMenu.appendChild(li);
        });

        categoryEl.appendChild(subMenu);
        container.appendChild(categoryEl);
    });
}

// ============================================
// Toggle Filter (exclusive accordion)
// ============================================
function toggleFilter(titleElement) {
    const category = titleElement.parentElement;
    const isActive = category.classList.contains('filter-category-active');

    document.querySelectorAll('.product-filter-category').forEach(cat => {
        cat.classList.remove('filter-category-active');
        const sm = cat.querySelector('.product-sub-menu');
        if (sm) sm.classList.remove('active');
        const ic = cat.querySelector('.filter-icon');
        if (ic) ic.classList.remove('rotate');
    });

    if (!isActive) {
        category.classList.add('filter-category-active');
        const subMenu = category.querySelector('.product-sub-menu');
        if (subMenu) subMenu.classList.add('active');
        const icon = category.querySelector('.filter-icon');
        if (icon) icon.classList.add('rotate');
    }
}

// ============================================
// Filter Logic (unchanged)
// ============================================
function onFilterChange(checkbox) {
    const key = checkbox.name;
    const value = checkbox.value;
    if (!selectedFilters[key]) selectedFilters[key] = new Set();
    if (checkbox.checked) {
        selectedFilters[key].add(value);
    } else {
        selectedFilters[key].delete(value);
        if (selectedFilters[key].size === 0) delete selectedFilters[key];
    }
    updateFilterState();
}

function productMatchesValue(product, key, value) {
    const pv = product[key];
    if (Array.isArray(pv)) return pv.includes(value);
    return String(pv) === String(value);
}

function productMatchesFilters(product, filters) {
    for (const [key, values] of Object.entries(filters)) {
        if (values.size === 0) continue;
        const pv = product[key];
        let m = false;
        if (Array.isArray(pv)) { for (const v of values) { if (pv.includes(v)) { m = true; break; } } }
        else { m = values.has(String(pv)); }
        if (!m) return false;
    }
    return true;
}

function updateFilterState() {
    const activeFilters = {};
    for (const [key, values] of Object.entries(selectedFilters)) {
        if (values.size > 0) activeFilters[key] = values;
    }
    const matchingProducts = products.filter(p => productMatchesFilters(p, activeFilters));

    filterCategories.forEach(category => {
        const key = category.key;
        const filtersWithout = {};
        for (const [k, v] of Object.entries(activeFilters)) { if (k !== key) filtersWithout[k] = v; }
        const productsForCategory = products.filter(p => productMatchesFilters(p, filtersWithout));
        let selectedCount = 0;

        category.options.forEach(option => {
            const li = document.querySelector(`.product-filter-item[data-filter-key="${key}"][data-filter-value="${option.value}"]`);
            if (!li) return;
            const count = productsForCategory.filter(p => productMatchesValue(p, key, String(option.value))).length;
            const countEl = document.getElementById(`count-${key}-${option.value}`);
            if (countEl) countEl.textContent = `(${count})`;
            const checkbox = li.querySelector('.gbt-main-checkbox');
            const isSelected = selectedFilters[key] && selectedFilters[key].has(String(option.value));
            if (isSelected) selectedCount++;
            if (count === 0 && !isSelected) { li.classList.add('disabled'); checkbox.disabled = true; }
            else { li.classList.remove('disabled'); checkbox.disabled = false; }
        });

        const badge = document.getElementById(`badge-${key}`);
        if (badge) {
            if (selectedCount > 0) { badge.style.display = 'inline-flex'; badge.textContent = selectedCount; }
            else { badge.style.display = 'none'; }
        }
    });

    document.getElementById('match-count').textContent = matchingProducts.length;
    document.getElementById('results-match-count').textContent = matchingProducts.length;
    renderFilterTags();
    renderResults(matchingProducts);
}

// ============================================
// Filter Tags (unchanged)
// ============================================
function renderFilterTags() {
    const container = document.getElementById('filter-tags-container');
    const list = document.getElementById('filter-tags-list');
    list.innerHTML = '';
    let hasFilters = false;
    for (const [key, values] of Object.entries(selectedFilters)) {
        if (values.size === 0) continue;
        hasFilters = true;
        const category = filterCategories.find(c => c.key === key);
        if (!category) continue;
        for (const value of values) {
            const option = category.options.find(o => String(o.value) === String(value));
            if (!option) continue;
            const tag = document.createElement('button');
            tag.className = 'filter-tag';
            tag.onclick = function() { removeFilter(key, value); };
            tag.innerHTML = `<span>${category.name}: ${option.label}</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="tag-remove">
                    <path d="M2.79 2.79a.996.996 0 0 1 1.41 0l7.79 7.79 7.79-7.79a.996.996 0 1 1 1.41 1.41l-7.79 7.79 7.79 7.79a.996.996 0 1 1-1.41 1.41l-7.79-7.79-7.79 7.79a.996.996 0 1 1-1.41-1.41l7.79-7.79-7.79-7.78a.996.996 0 0 1 0-1.41Z" style="fill-rule:evenodd;stroke-width:0;"></path>
                </svg>`;
            list.appendChild(tag);
        }
    }
    container.style.display = hasFilters ? 'block' : 'none';
}

function removeFilter(key, value) {
    if (selectedFilters[key]) {
        selectedFilters[key].delete(String(value));
        if (selectedFilters[key].size === 0) delete selectedFilters[key];
    }
    const li = document.querySelector(`.product-filter-item[data-filter-key="${key}"][data-filter-value="${value}"]`);
    if (li) { const cb = li.querySelector('.gbt-main-checkbox'); if (cb) cb.checked = false; }
    updateFilterState();
}

function resetAllFilters() {
    selectedFilters = {};
    document.querySelectorAll('.gbt-main-checkbox').forEach(cb => { cb.checked = false; });
    updateFilterState();
}

// ============================================
// Label helpers
// ============================================
function buildLabelMap() {
    const m = {};
    filterCategories.forEach(cat => { cat.options.forEach(opt => { m[`${cat.key}:${opt.value}`] = opt.label; }); });
    return m;
}
function getLabel(m, key, val) { return m[`${key}:${val}`] || val; }

// ============================================
// Render Results (original table + arrow column)
// ============================================
function renderResults(matchingProducts) {
    const list = document.getElementById('results-list');
    if (matchingProducts.length === 0) {
        list.innerHTML = `<div class="results-empty">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <p>No matching configurations found. Try adjusting your filters.</p></div>`;
        return;
    }

    const lm = buildLabelMap();
    let html = `<table class="results-table"><thead><tr>
        <th>Model</th><th>Platform</th><th>Vendor</th><th>CPU Series</th>
        <th>Form Factor</th><th>GPU</th><th>Cooling</th><th>DIMM</th><th>LAN</th><th></th>
    </tr></thead><tbody>`;

    matchingProducts.forEach(p => {
        const gpuText = p.gpus > 0 ? p.gpus + 'x ' + getLabel(lm, 'gpuType', p.gpuType) : 'No GPU';
        html += `<tr class="result-row-clickable" onclick="openConfigurator('${p.id}')">
            <td><strong>${p.id}</strong></td>
            <td><span class="result-badge platform">${getLabel(lm, 'platform', p.platform)}</span></td>
            <td><span class="result-badge vendor">${getLabel(lm, 'vendor', p.vendor)}</span></td>
            <td>${getLabel(lm, 'cpuSeries', p.cpuSeries)}</td>
            <td><span class="result-badge form-factor">${getLabel(lm, 'formFactor', p.formFactor)}</span></td>
            <td><span class="result-badge gpu">${gpuText}</span></td>
            <td><span class="result-badge cooling">${getLabel(lm, 'cooling', p.cooling)}</span></td>
            <td>${p.dimmSlots}</td>
            <td>${getLabel(lm, 'lanSpeed', p.lanSpeed)}</td>
            <td class="result-arrow-cell">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </td>
        </tr>`;
    });

    html += '</tbody></table>';
    list.innerHTML = html;
}

// ============================================
// Configuration Page
// ============================================
function renderConfigPage() {
    const content = document.getElementById('config-content');
    const lm = buildLabelMap();
    const p = selectedProduct;
    const gpuText = p.gpus > 0 ? p.gpus + '\u00d7 ' + getLabel(lm, 'gpuType', p.gpuType) : 'No GPU';

    let html = `<div class="config-summary-card">
        <div class="config-summary-name">${p.id}</div>
        <div class="config-summary-badges">
            <span class="result-badge platform">${getLabel(lm, 'platform', p.platform)}</span>
            <span class="result-badge vendor">${getLabel(lm, 'vendor', p.vendor)}</span>
            <span class="result-badge form-factor">${getLabel(lm, 'formFactor', p.formFactor)}</span>
            <span class="result-badge cooling">${getLabel(lm, 'cooling', p.cooling)}</span>
        </div>
        <div class="config-summary-detail">
            ${getLabel(lm, 'cpuSeries', p.cpuSeries)} &middot; ${gpuText} &middot; ${p.dimmSlots} DIMM Slots &middot; ${getLabel(lm, 'lanSpeed', p.lanSpeed)}
        </div>
    </div>`;

    // CPU
    html += buildConfigSection('cpu', 'Processor (CPU)', cpuOptions[p.cpuSeries] || [], currentConfig.cpu);

    // DIMM
    if (p.dimmSlots > 0) {
        const dimmWithTotal = dimmOptions.map(d => {
            const gb = parseInt(d.name.match(/(\d+)GB/)?.[1] || '0');
            const total = gb * p.dimmSlots;
            const totalStr = total >= 1024 ? (total / 1024) + 'TB' : total + 'GB';
            return { ...d, desc: d.desc + ' / ' + p.dimmSlots + ' slots = ' + totalStr + ' Total' };
        });
        html += buildConfigSection('dimm', 'Memory (DIMM)', dimmWithTotal, currentConfig.dimm);
    } else {
        html += `<div class="config-section"><div class="config-section-header">
            <span class="config-section-label">Memory (DIMM)</span>
            <span class="config-section-value">Integrated Memory (No DIMM Slots)</span>
        </div></div>`;
    }

    // LAN
    html += buildConfigSection('lanCard', 'LAN Card', lanCardOptions, currentConfig.lanCard);

    // RAID
    html += buildConfigSection('raidCard', 'RAID Card', raidCardOptions, currentConfig.raidCard);

    content.innerHTML = html;
}

function buildConfigSection(key, title, options, selectedValue) {
    const selOpt = options.find(o => o.id === selectedValue);
    const summary = selOpt ? selOpt.name : 'Not selected';
    const isOpen = !selOpt; // auto-open if nothing selected

    let html = `<div class="config-section ${isOpen ? 'open' : ''}" data-key="${key}">
        <div class="config-section-header" onclick="toggleSection(this)">
            <span class="config-section-label">${title}</span>
            <span class="config-section-value" id="summary-${key}">${summary}</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="config-section-chevron">
                <path d="M2.29 7.29a.996.996 0 0 1 1.41 0l8.29 8.29 8.29-8.29a.996.996 0 1 1 1.41 1.41l-9 9a.996.996 0 0 1-1.41 0L2.29 8.71a.996.996 0 0 1 0-1.41Z" style="fill-rule:evenodd;"/>
            </svg>
        </div>
        <div class="config-section-body"><div class="config-option-list">`;

    options.forEach(opt => {
        const checked = opt.id === selectedValue ? 'checked' : '';
        html += `<label class="config-option ${checked ? 'selected' : ''}">
            <input type="radio" name="cfg-${key}" value="${opt.id}" ${checked} onchange="onConfigChange('${key}','${opt.id}')">
            <span class="radio-dot"></span>
            <div class="config-option-text">
                <div class="config-option-name">${opt.name}</div>
                <div class="config-option-desc">${opt.desc}</div>
            </div>
        </label>`;
    });

    html += '</div></div></div>';
    return html;
}

function toggleSection(headerEl) {
    headerEl.parentElement.classList.toggle('open');
}

function onConfigChange(key, value) {
    currentConfig[key] = value;
    const summary = document.getElementById('summary-' + key);
    let opts;
    if (key === 'cpu') opts = cpuOptions[selectedProduct.cpuSeries] || [];
    else if (key === 'dimm') opts = dimmOptions;
    else if (key === 'lanCard') opts = lanCardOptions;
    else if (key === 'raidCard') opts = raidCardOptions;
    const opt = opts ? opts.find(o => o.id === value) : null;
    if (summary && opt) summary.textContent = opt.name;

    const section = document.querySelector(`.config-section[data-key="${key}"]`);
    if (section) {
        section.querySelectorAll('.config-option').forEach(label => {
            label.classList.toggle('selected', label.querySelector('input').value === value);
        });
    }
}

// ============================================
// Config Actions
// ============================================
function cancelConfig() {
    editingCartIndex = -1;
    currentConfig = { cpu: '', dimm: '', lanCard: '', raidCard: '' };
    selectedProduct = null;
    navigateTo('main');
}

function saveDraft() {
    if (!selectedProduct) return;
    const item = { productId: selectedProduct.id, config: { ...currentConfig }, status: 'draft', timestamp: new Date().toISOString() };
    if (editingCartIndex >= 0) cartItems[editingCartIndex] = item;
    else cartItems.push(item);
    persistCart();
    editingCartIndex = -1;
    navigateTo('main');
}

function submitConfig() {
    if (!selectedProduct) return;
    const hasCpu = !!currentConfig.cpu;
    const hasDimm = selectedProduct.dimmSlots === 0 || !!currentConfig.dimm;
    const hasLan = !!currentConfig.lanCard;
    const hasRaid = !!currentConfig.raidCard;
    if (!hasCpu || !hasDimm || !hasLan || !hasRaid) { alert('Please complete all configuration selections before submitting.'); return; }

    const item = { productId: selectedProduct.id, config: { ...currentConfig }, status: 'confirmed', timestamp: new Date().toISOString() };
    if (editingCartIndex >= 0) cartItems[editingCartIndex] = item;
    else cartItems.push(item);
    persistCart();
    editingCartIndex = -1;
    showCart();
}

// ============================================
// Cart
// ============================================
function persistCart() {
    localStorage.setItem('serverCartItems', JSON.stringify(cartItems));
    updateCartBadge();
}

function updateCartBadge() {
    const badge = document.getElementById('cart-badge');
    badge.textContent = cartItems.length;
    badge.style.display = cartItems.length > 0 ? 'flex' : 'none';
}

function removeCartItem(index) { cartItems.splice(index, 1); persistCart(); renderCart(); }
function editCartItem(index) { openConfigurator(cartItems[index].productId, index); }
function confirmCartItem(index) { cartItems[index].status = 'confirmed'; cartItems[index].timestamp = new Date().toISOString(); persistCart(); renderCart(); }

function renderCart() {
    const content = document.getElementById('cart-content');
    if (cartItems.length === 0) {
        content.innerHTML = `<div class="cart-empty">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="56" height="56" fill="#cbd5e1">
                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            <p style="font-size:15px;font-weight:600;color:#475569;margin:12px 0 4px;">Your cart is empty</p>
            <p style="font-size:13px;color:#94a3b8;margin:0;">Configure a server model and save it to your cart.</p>
            <button class="btn btn-submit" onclick="navigateTo('main')" style="margin-top:16px;">Browse Models</button>
        </div>`;
        return;
    }

    const lm = buildLabelMap();
    const confirmed = cartItems.filter(i => i.status === 'confirmed').length;
    const drafts = cartItems.filter(i => i.status === 'draft').length;

    let html = `<div class="cart-stats">
        <span>${cartItems.length} item(s)</span>
        <span><span style="color:#16a34a;font-weight:500;">${confirmed} confirmed</span> &middot; <span style="color:#d97706;font-weight:500;">${drafts} draft(s)</span></span>
    </div>`;

    cartItems.forEach((item, i) => {
        const product = products.find(p => p.id === item.productId);
        if (!product) return;
        const gpuText = product.gpus > 0 ? product.gpus + '\u00d7 ' + getLabel(lm, 'gpuType', product.gpuType) : 'No GPU';
        const cpuName = resolveOptName('cpu', product.cpuSeries, item.config.cpu);
        const dimmName = product.dimmSlots > 0 ? resolveOptName('dimm', null, item.config.dimm) : 'Integrated';
        const lanName = resolveOptName('lanCard', null, item.config.lanCard);
        const raidName = resolveOptName('raidCard', null, item.config.raidCard);
        const statusCls = item.status === 'confirmed' ? 'badge-confirmed' : 'badge-draft';
        const statusTxt = item.status === 'confirmed' ? 'Confirmed' : 'Draft';

        html += `<div class="cart-item">
            <div class="cart-item-top">
                <div class="cart-item-title">
                    <strong>${item.productId}</strong>
                    <span class="cart-status-badge ${statusCls}">${statusTxt}</span>
                </div>
                <div class="cart-item-actions">
                    ${item.status === 'draft' ? `<button class="cart-btn-icon cart-btn-confirm" onclick="confirmCartItem(${i})" title="Confirm"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></button>` : ''}
                    <button class="cart-btn-icon cart-btn-edit" onclick="editCartItem(${i})" title="Edit"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
                    <button class="cart-btn-icon cart-btn-del" onclick="removeCartItem(${i})" title="Remove"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
                </div>
            </div>
            <div class="cart-item-badges">
                <span class="result-badge platform">${getLabel(lm, 'platform', product.platform)}</span>
                <span class="result-badge vendor">${getLabel(lm, 'vendor', product.vendor)}</span>
                <span class="result-badge form-factor">${getLabel(lm, 'formFactor', product.formFactor)}</span>
                <span class="result-badge cooling">${getLabel(lm, 'cooling', product.cooling)}</span>
                <span style="font-size:11px;color:#64748b;">${gpuText}</span>
            </div>
            <table class="cart-config-table">
                <tr><td class="cart-cfg-label">CPU</td><td>${cpuName}</td></tr>
                <tr><td class="cart-cfg-label">Memory</td><td>${dimmName}</td></tr>
                <tr><td class="cart-cfg-label">LAN Card</td><td>${lanName}</td></tr>
                <tr><td class="cart-cfg-label">RAID Card</td><td>${raidName}</td></tr>
            </table>
            <div class="cart-item-time">Updated: ${new Date(item.timestamp).toLocaleString()}</div>
        </div>`;
    });

    content.innerHTML = html;
}

function resolveOptName(key, cpuSeries, optionId) {
    if (!optionId) return '<em style="color:#94a3b8;">Not selected</em>';
    let opts;
    if (key === 'cpu') opts = cpuOptions[cpuSeries] || [];
    else if (key === 'dimm') opts = dimmOptions;
    else if (key === 'lanCard') opts = lanCardOptions;
    else if (key === 'raidCard') opts = raidCardOptions;
    else return optionId;
    const o = opts.find(x => x.id === optionId);
    return o ? o.name : optionId;
}

// ============================================
// Start
// ============================================
loadData();
</script>
