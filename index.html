// ============================================
// XLSX Parsing
// ============================================
function parseXLSX(arrayBuffer) {
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];
    return XLSX.utils.sheet_to_json(sheet, { defval: '' });
}

function parseProductsXLSX(arrayBuffer) {
    const rows = parseXLSX(arrayBuffer);
    return rows.map(row => ({
        id: String(row.id || ''),
        platform: String(row.platform || ''),
        cooling: String(row.cooling || ''),
        vendor: String(row.vendor || ''),
        cpuSeries: String(row.cpuSeries || ''),
        formFactor: String(row.formFactor || ''),
        gpuType: String(row.gpuType || ''),
        gpus: parseInt(row.gpus, 10) || 0,
        dimmSlots: parseInt(row.dimmSlots, 10) || 0,
        lanSpeed: String(row.lanSpeed || ''),
        application: row.application ? String(row.application).split('|') : []
    }));
}

function parseFiltersXLSX(arrayBuffer) {
    const rows = parseXLSX(arrayBuffer);
    const categoryMap = new Map();

    rows.forEach(row => {
        const key = String(row.category_key || '');
        if (!categoryMap.has(key)) {
            categoryMap.set(key, {
                key: key,
                name: String(row.category_name || ''),
                options: []
            });
        }
        categoryMap.get(key).options.push({
            value: String(row.option_value || ''),
            label: String(row.option_label || '')
        });
    });

    return Array.from(categoryMap.values());
}

// ============================================
// Load XLSX files and initialize
// ============================================
async function loadData() {
    const [productsResp, filtersResp] = await Promise.all([
        fetch('products.xlsx'),
        fetch('filters.xlsx')
    ]);

    const productsBuf = await productsResp.arrayBuffer();
    const filtersBuf = await filtersResp.arrayBuffer();

    products = parseProductsXLSX(productsBuf);
    filterCategories = parseFiltersXLSX(filtersBuf);

    init();
}

// ============================================
// Initialize UI
// ============================================
function init() {
    document.getElementById('total-count').textContent = products.length;
    renderFilterCategories();
    updateFilterState();
    updateCartBadge();
}

// ============================================
// View Navigation
// ============================================
function switchView(viewName) {
    currentView = viewName;
    document.querySelectorAll('.view-container').forEach(v => {
        v.classList.remove('view-active');
        v.classList.add('view-hidden');
    });
    const target = document.getElementById(viewName + '-view');
    if (target) {
        target.classList.remove('view-hidden');
        target.classList.add('view-active');
    }
}

function showMain() {
    switchView('main');
}

function showCart() {
    renderCart();
    switchView('cart');
}

function openConfigurator(productId, cartIndex) {
    selectedProduct = products.find(p => p.id === productId);
    if (!selectedProduct) return;

    if (typeof cartIndex === 'number' && cartIndex >= 0) {
        editingCartIndex = cartIndex;
        const item = cartItems[cartIndex];
        currentConfig = { ...item.config };
    } else {
        editingCartIndex = -1;
        currentConfig = { cpu: '', dimm: '', lanCard: '', raidCard: '' };
    }

    renderConfigPage();
    switchView('configure');
}

// Render Filter Categories
// ============================================
function renderFilterCategories() {
    const container = document.getElementById('filter-option-container');
    container.innerHTML = '';

    filterCategories.forEach(category => {
        const categoryEl = document.createElement('div');
        categoryEl.className = 'product-filter-category';
        categoryEl.dataset.filterKey = category.key;

        const titleEl = document.createElement('div');
        titleEl.className = 'product-category-title';
        titleEl.onclick = function() { toggleFilter(this); };
        titleEl.innerHTML = `
            <span class="product-category-name">${category.name}<span class="filter-count-badge" id="badge-${category.key}" style="display:none;">0</span></span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="filter-icon">

            </svg>
        `;
        categoryEl.appendChild(titleEl);

        const subMenu = document.createElement('ul');
        subMenu.className = 'product-sub-menu';
        subMenu.dataset.filterKey = category.key;

        category.options.forEach(option => {
            const li = document.createElement('li');
            li.className = 'product-filter-item';
            li.dataset.filterKey = category.key;
            li.dataset.filterValue = option.value;

            li.innerHTML = `
                <div class="gbt-checkbox-wrapper">
                    <label class="gbt-main-checkbox-label" style="gap:8px;">
                        <div class="gbt-main-checkbox-container">
                            <input type="checkbox" class="gbt-main-checkbox"
                                   name="${category.key}"
                                   value="${option.value}"
                                   onchange="onFilterChange(this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" fill="none" style="pointer-events:none;" class="gbt-main-checkbox-check">
                                <path fill="#fff" fill-rule="evenodd" d="M11.218.304a1 1 0 0 1-.022 1.414l-6.187 6a1 1 0 0 1-1.393 0L.804 4.99a1 1 0 0 1 1.392-1.436l2.117 2.052L9.803.282a1 1 0 0 1 1.415.022" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <span class="gbt-main-checkbox-label-text">${option.label}</span>
                        <span class="option-count" id="count-${category.key}-${option.value}"></span>
                    </label>
                </div>
            `;
            subMenu.appendChild(li);
        });

        categoryEl.appendChild(subMenu);
        container.appendChild(categoryEl);
    });
}

// ============================================
// Toggle Filter Category (Exclusive Accordion)
// ============================================
function toggleFilter(titleElement) {
    const category = titleElement.parentElement;
    const isActive = category.classList.contains('filter-category-active');

    // Close ALL categories first
    document.querySelectorAll('.product-filter-category').forEach(cat => {
        cat.classList.remove('filter-category-active');
        const sm = cat.querySelector('.product-sub-menu');
        if (sm) sm.classList.remove('active');
        const ic = cat.querySelector('.filter-icon');
        if (ic) ic.classList.remove('rotate');
    });

    // If the clicked one wasn't active, open it
    if (!isActive) {
        category.classList.add('filter-category-active');
        const subMenu = category.querySelector('.product-sub-menu');
        if (subMenu) subMenu.classList.add('active');
        const icon = category.querySelector('.filter-icon');
        if (icon) icon.classList.add('rotate');
    }
}

// ============================================
// Handle Filter Change
// ============================================
function onFilterChange(checkbox) {
    const key = checkbox.name;
    const value = checkbox.value;

    if (!selectedFilters[key]) {
        selectedFilters[key] = new Set();
    }

    if (checkbox.checked) {
        selectedFilters[key].add(value);
    } else {
        selectedFilters[key].delete(value);
        if (selectedFilters[key].size === 0) {
            delete selectedFilters[key];
        }
    }

    updateFilterState();
}

// ============================================
// Product matching helpers
// ============================================
function productMatchesValue(product, key, value) {
    const productValue = product[key];
    if (Array.isArray(productValue)) {
        return productValue.includes(value);
    }
    return String(productValue) === String(value);
}

function productMatchesFilters(product, filters) {
    for (const [key, values] of Object.entries(filters)) {
        if (values.size === 0) continue;
        const productValue = product[key];
        let matches = false;

        if (Array.isArray(productValue)) {
            for (const v of values) {
                if (productValue.includes(v)) { matches = true; break; }
            }
        } else {
            matches = values.has(String(productValue));
        }

        if (!matches) return false;
    }
    return true;
}

// ============================================
// Core: Update All Filter States
// ============================================
function updateFilterState() {
    const activeFilters = {};
    for (const [key, values] of Object.entries(selectedFilters)) {
        if (values.size > 0) activeFilters[key] = values;
    }

    const matchingProducts = products.filter(p => productMatchesFilters(p, activeFilters));

    filterCategories.forEach(category => {
        const key = category.key;
        const filtersWithout = {};
        for (const [k, v] of Object.entries(activeFilters)) {
            if (k !== key) filtersWithout[k] = v;
        }
        const productsForCategory = products.filter(p => productMatchesFilters(p, filtersWithout));

        let selectedCount = 0;

        category.options.forEach(option => {
            const li = document.querySelector(
                `.product-filter-item[data-filter-key="${key}"][data-filter-value="${option.value}"]`
            );
            if (!li) return;

            const count = productsForCategory.filter(p =>
                productMatchesValue(p, key, String(option.value))
            ).length;

            const countEl = document.getElementById(`count-${key}-${option.value}`);
            if (countEl) countEl.textContent = `(${count})`;

            const checkbox = li.querySelector('.gbt-main-checkbox');
            const isSelected = selectedFilters[key] && selectedFilters[key].has(String(option.value));
            if (isSelected) selectedCount++;

            if (count === 0 && !isSelected) {
                li.classList.add('disabled');
                checkbox.disabled = true;
            } else {
                li.classList.remove('disabled');
                checkbox.disabled = false;
            }
        });

        const badge = document.getElementById(`badge-${key}`);
        if (badge) {
            if (selectedCount > 0) {
                badge.style.display = 'inline-flex';
                badge.textContent = selectedCount;
            } else {
                badge.style.display = 'none';
            }
        }
    });

    document.getElementById('match-count').textContent = matchingProducts.length;
    document.getElementById('results-match-count').textContent = matchingProducts.length;

    renderFilterTags();
    renderResults(matchingProducts);
}

// ============================================
// Render Filter Tags
// ============================================
function renderFilterTags() {
    const container = document.getElementById('filter-tags-container');
    const list = document.getElementById('filter-tags-list');
    list.innerHTML = '';
    let hasFilters = false;

    for (const [key, values] of Object.entries(selectedFilters)) {
        if (values.size === 0) continue;
        hasFilters = true;
        const category = filterCategories.find(c => c.key === key);
        if (!category) continue;

        for (const value of values) {
            const option = category.options.find(o => String(o.value) === String(value));
            if (!option) continue;

            const tag = document.createElement('button');
            tag.className = 'filter-tag';
            tag.onclick = function() { removeFilter(key, value); };
            tag.innerHTML = `
                <span>${category.name}: ${option.label}</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="tag-remove">
                    <path d="M2.79 2.79a.996.996 0 0 1 1.41 0l7.79 7.79 7.79-7.79a.996.996 0 1 1 1.41 1.41l-7.79 7.79 7.79 7.79a.996.996 0 1 1-1.41 1.41l-7.79-7.79-7.79 7.79a.996.996 0 1 1-1.41-1.41l7.79-7.79-7.79-7.78a.996.996 0 0 1 0-1.41Z" style="fill-rule:evenodd;stroke-width:0;"></path>
                </svg>
            `;
            list.appendChild(tag);
        }
    }

    container.style.display = hasFilters ? 'block' : 'none';
}

// ============================================
// Remove / Reset Filters
// ============================================
function removeFilter(key, value) {
    if (selectedFilters[key]) {
        selectedFilters[key].delete(String(value));
        if (selectedFilters[key].size === 0) delete selectedFilters[key];
    }
    const li = document.querySelector(
        `.product-filter-item[data-filter-key="${key}"][data-filter-value="${value}"]`
    );
    if (li) {
        const cb = li.querySelector('.gbt-main-checkbox');
        if (cb) cb.checked = false;
    }
    updateFilterState();
}

function resetAllFilters() {
    selectedFilters = {};
    document.querySelectorAll('.gbt-main-checkbox').forEach(cb => { cb.checked = false; });
    updateFilterState();
}

// ============================================
// Label helper
// ============================================
function buildLabelMap() {
    const labelMap = {};
    filterCategories.forEach(cat => {
        cat.options.forEach(opt => {
            labelMap[`${cat.key}:${opt.value}`] = opt.label;
        });
    });
    return labelMap;
}

function getLabel(labelMap, key, value) {
    return labelMap[`${key}:${value}`] || value;
}

// ============================================
// Render Results (Card Layout)
// ============================================
function renderResults(matchingProducts) {
    const list = document.getElementById('results-list');

    if (matchingProducts.length === 0) {
        list.innerHTML = `
            <div class="results-empty">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <p>No matching configurations found. Try adjusting your filters.</p>
            </div>`;
        return;
    }

    const labelMap = buildLabelMap();
    let html = '<div class="product-cards">';

    matchingProducts.forEach(p => {
        const gpuText = p.gpus > 0
            ? p.gpus + '\u00d7 ' + getLabel(labelMap, 'gpuType', p.gpuType)
            : 'No GPU';
        const apps = p.application.map(a => getLabel(labelMap, 'application', a)).join(', ');

        html += `
            <div class="product-card" onclick="openConfigurator('${p.id}')">
                <div class="product-card-body">
                    <div class="product-card-header">
                        <span class="product-card-name">${p.id}</span>
                        <span class="result-badge form-factor">${getLabel(labelMap, 'formFactor', p.formFactor)}</span>
                    </div>
                    <div class="product-card-badges">
                        <span class="result-badge platform">${getLabel(labelMap, 'platform', p.platform)}</span>
                        <span class="result-badge vendor">${getLabel(labelMap, 'vendor', p.vendor)}</span>
                        <span class="card-spec-text">${getLabel(labelMap, 'cpuSeries', p.cpuSeries)}</span>
                    </div>
                    <div class="product-card-specs">
                        <span>${gpuText}</span>
                        <span class="spec-sep">&middot;</span>
                        <span class="result-badge cooling">${getLabel(labelMap, 'cooling', p.cooling)}</span>
                        <span class="spec-sep">&middot;</span>
                        <span>${p.dimmSlots} DIMM</span>
                        <span class="spec-sep">&middot;</span>
                        <span>${getLabel(labelMap, 'lanSpeed', p.lanSpeed)}</span>
                    </div>
                    <div class="product-card-apps">${apps}</div>
                </div>
                <div class="product-card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </div>
            </div>`;
    });

    html += '</div>';
    list.innerHTML = html;
}

// ============================================
// Configuration Page
// ============================================
function renderConfigPage() {
    const content = document.getElementById('config-content');
    const labelMap = buildLabelMap();
    const p = selectedProduct;

    const gpuText = p.gpus > 0
        ? p.gpus + '\u00d7 ' + getLabel(labelMap, 'gpuType', p.gpuType)
        : 'No GPU';

    // Product summary
    let html = `
        <div class="config-product-summary">
            <div class="config-product-name">${p.id}</div>
            <div class="config-product-specs">
                <span class="result-badge platform">${getLabel(labelMap, 'platform', p.platform)}</span>
                <span class="result-badge vendor">${getLabel(labelMap, 'vendor', p.vendor)}</span>
                <span class="result-badge form-factor">${getLabel(labelMap, 'formFactor', p.formFactor)}</span>
                <span class="result-badge cooling">${getLabel(labelMap, 'cooling', p.cooling)}</span>
            </div>
            <div class="config-product-detail">
                ${getLabel(labelMap, 'cpuSeries', p.cpuSeries)} &middot;
                ${gpuText} &middot;
                ${p.dimmSlots} DIMM Slots &middot;
                ${getLabel(labelMap, 'lanSpeed', p.lanSpeed)}
            </div>
        </div>
    `;

    // CPU Section
    const cpus = cpuOptions[p.cpuSeries] || [];
    html += renderConfigSection('cpu', 'Processor (CPU)', cpus, currentConfig.cpu,
        'svg-cpu', '<path d="M15 21h-2v-2h2v2zm-2-7h-2v5h2v-5zm8-2h-2v4h2v-4zm-2-2h-2v2h2V8zM7 12H5v4h2v-4zm-2-2H3v2h2V8zm7-5h2V3h-2v2zm-7.5 0h2V1h-2v2zM21 5V1h-2v4h2zM3 5V1H1v4h2zm0 16H1v-4h2v4zm18 0v-4h2v4h-2zM15 5h2V3h-2v2zM5 5h2V3H5v2zm0 16h2v-2H5v2zM9 5V1H7v4h2zM3 9H1v2h2V9zm0 4H1v2h2v-2zM1 7h2V5H1v2zm20 4h2V9h-2v2zm0-6v2h2V5h-2zm0 8h2v-2h-2v2zM9 21h2v-2H9v2zM7 7H5v2h2V7zm10 10h-2v4h2v-4zm-6 4h2v-2h-2v2zM9 7h6v6H9V7z"/>');

    // DIMM Section
    if (p.dimmSlots > 0) {
        const dimmWithTotal = dimmOptions.map(d => {
            const sizeMatch = d.name.match(/(\d+)GB/);
            const sizeGB = sizeMatch ? parseInt(sizeMatch[1]) : 0;
            const totalGB = sizeGB * p.dimmSlots;
            const totalStr = totalGB >= 1024 ? (totalGB / 1024) + 'TB' : totalGB + 'GB';
            return { ...d, desc: d.desc + ' / ' + p.dimmSlots + ' slots = ' + totalStr + ' Total' };
        });
        html += renderConfigSection('dimm', 'Memory (DIMM)', dimmWithTotal, currentConfig.dimm,
            'svg-dimm', '<path d="M2 7v9h4v-4h2v4h2v-4h2v4h2v-4h2v4h2v-4h2v4h4V7H2zm18 7h-2v-4h2v4z"/>');
    } else {
        html += `
            <div class="config-section">
                <div class="config-section-header" onclick="toggleConfigSection(this)">
                    <div class="config-section-title">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" class="config-section-icon">
                            <path d="M2 7v9h4v-4h2v4h2v-4h2v4h2v-4h2v4h2v-4h2v4h4V7H2zm18 7h-2v-4h2v4z"/>
                        </svg>
                        Memory (DIMM)
                    </div>
                    <span class="config-section-summary">Integrated Memory (No DIMM Slots)</span>
                </div>
            </div>`;
    }

    // LAN Card Section
    html += renderConfigSection('lanCard', 'LAN Card', lanCardOptions, currentConfig.lanCard,
        'svg-lan', '<path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>');

    // RAID Card Section
    html += renderConfigSection('raidCard', 'RAID Card', raidCardOptions, currentConfig.raidCard,
        'svg-raid', '<path d="M2 20h20v-4H2v4zm2-3h2v2H4v-2zM2 4v4h20V4H2zm4 3H4V5h2v2zm-4 7h20v-4H2v4zm2-3h2v2H4v-2z"/>');

    content.innerHTML = html;

    // Open the first section by default
    const firstSection = content.querySelector('.config-section-header');
    if (firstSection) {
        toggleConfigSection(firstSection);
    }
}

function renderConfigSection(key, title, options, selectedValue, svgClass, svgPath) {
    const selectedOpt = options.find(o => o.id === selectedValue);
    const summaryText = selectedOpt ? selectedOpt.name : 'Not selected';

    let html = `
        <div class="config-section" data-section-key="${key}">
            <div class="config-section-header" onclick="toggleConfigSection(this)">
                <div class="config-section-title">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" class="config-section-icon">
                        ${svgPath}
                    </svg>
                    ${title}
                </div>
                <div class="config-section-right">
                    <span class="config-section-summary">${summaryText}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="config-chevron">
                        <path d="M2.29 7.29a.996.996 0 0 1 1.41 0l8.29 8.29 8.29-8.29a.996.996 0 1 1 1.41 1.41l-9 9a.996.996 0 0 1-1.41 0L2.29 8.71a.996.996 0 0 1 0-1.41Z" style="fill-rule: evenodd;"></path>
                    </svg>
                </div>
            </div>
            <div class="config-section-body">
                <div class="config-options">`;

    options.forEach(opt => {
        const checked = opt.id === selectedValue ? 'checked' : '';
        html += `
                    <label class="config-option ${checked ? 'selected' : ''}" onclick="selectConfigOption('${key}', '${opt.id}', this)">
                        <div class="config-radio-wrapper">
                            <input type="radio" name="config-${key}" value="${opt.id}" ${checked}
                                   onchange="onConfigChange('${key}', '${opt.id}')">
                            <span class="config-radio-custom"></span>
                        </div>
                        <div class="config-option-info">
                            <div class="config-option-name">${opt.name}</div>
                            <div class="config-option-desc">${opt.desc}</div>
                        </div>
                    </label>`;
    });

    html += `
                </div>
            </div>
        </div>`;
    return html;
}

function toggleConfigSection(headerEl) {
    const section = headerEl.parentElement;
    const isActive = section.classList.contains('config-section-active');

    if (isActive) {
        section.classList.remove('config-section-active');
    } else {
        section.classList.add('config-section-active');
    }
}

function onConfigChange(key, value) {
    currentConfig[key] = value;
    // Update summary text
    const section = document.querySelector(`.config-section[data-section-key="${key}"]`);
    if (section) {
        const summaryEl = section.querySelector('.config-section-summary');
        let options;
        if (key === 'cpu') options = cpuOptions[selectedProduct.cpuSeries] || [];
        else if (key === 'dimm') options = dimmOptions;
        else if (key === 'lanCard') options = lanCardOptions;
        else if (key === 'raidCard') options = raidCardOptions;

        const opt = options ? options.find(o => o.id === value) : null;
        if (summaryEl && opt) summaryEl.textContent = opt.name;

        // Update selected class on labels
        section.querySelectorAll('.config-option').forEach(label => {
            const radio = label.querySelector('input[type="radio"]');
            if (radio && radio.value === value) {
                label.classList.add('selected');
            } else {
                label.classList.remove('selected');
            }
        });
    }
}

function selectConfigOption(key, value, labelEl) {
    // This is handled by the radio onchange, but we also update the visual state
}

// ============================================
// Config Actions
// ============================================
function cancelConfig() {
    editingCartIndex = -1;
    currentConfig = { cpu: '', dimm: '', lanCard: '', raidCard: '' };
    selectedProduct = null;
    showMain();
}

function saveDraft() {
    if (!selectedProduct) return;

    const item = {
        productId: selectedProduct.id,
        config: { ...currentConfig },
        status: 'draft',
        timestamp: new Date().toISOString()
    };

    if (editingCartIndex >= 0) {
        cartItems[editingCartIndex] = item;
    } else {
        cartItems.push(item);
    }

    saveCart();
    editingCartIndex = -1;
    showMain();
}

function submitConfig() {
    if (!selectedProduct) return;

    // Validate that all required fields are selected
    const hasCpu = !!currentConfig.cpu;
    const hasDimm = selectedProduct.dimmSlots === 0 || !!currentConfig.dimm;
    const hasLan = !!currentConfig.lanCard;
    const hasRaid = !!currentConfig.raidCard;

    if (!hasCpu || !hasDimm || !hasLan || !hasRaid) {
        alert('Please complete all configuration selections before submitting.');
        return;
    }

    const item = {
        productId: selectedProduct.id,
        config: { ...currentConfig },
        status: 'confirmed',
        timestamp: new Date().toISOString()
    };

    if (editingCartIndex >= 0) {
        cartItems[editingCartIndex] = item;
    } else {
        cartItems.push(item);
    }

    saveCart();
    editingCartIndex = -1;
    showCart();
}

// ============================================
// Cart Management
// ============================================
function saveCart() {
    localStorage.setItem('serverCartItems', JSON.stringify(cartItems));
    updateCartBadge();
}

function updateCartBadge() {
    const badge = document.getElementById('cart-badge');
    if (badge) {
        if (cartItems.length > 0) {
            badge.style.display = 'flex';
            badge.textContent = cartItems.length;
        } else {
            badge.style.display = 'none';
        }
    }
}

function removeCartItem(index) {
    cartItems.splice(index, 1);
    saveCart();
    renderCart();
}

function editCartItem(index) {
    const item = cartItems[index];
    openConfigurator(item.productId, index);
}

function confirmCartItem(index) {
    cartItems[index].status = 'confirmed';
    cartItems[index].timestamp = new Date().toISOString();
    saveCart();
    renderCart();
}

function renderCart() {
    const content = document.getElementById('cart-content');

    if (cartItems.length === 0) {
        content.innerHTML = `
            <div class="cart-empty">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="#cbd5e1">
                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
                <p class="cart-empty-title">Your cart is empty</p>
                <p class="cart-empty-desc">Configure a server model and save it to your cart</p>
                <button class="action-btn submit-btn" onclick="showMain()" style="margin-top: 16px;">Browse Models</button>
            </div>`;
        return;
    }

    const labelMap = buildLabelMap();
    let confirmedCount = cartItems.filter(i => i.status === 'confirmed').length;
    let draftCount = cartItems.filter(i => i.status === 'draft').length;

    let html = `
        <div class="cart-summary-bar">
            <span class="cart-summary-total">${cartItems.length} item(s)</span>
            <span class="cart-summary-detail">
                <span class="status-confirmed-text">${confirmedCount} confirmed</span>
                <span class="spec-sep">&middot;</span>
                <span class="status-draft-text">${draftCount} draft(s)</span>
            </span>
        </div>
        <div class="cart-items">`;

    cartItems.forEach((item, index) => {
        const product = products.find(p => p.id === item.productId);
        if (!product) return;

        const gpuText = product.gpus > 0
            ? product.gpus + '\u00d7 ' + getLabel(labelMap, 'gpuType', product.gpuType)
            : 'No GPU';

        // Resolve config option names
        const cpuName = resolveOptionName('cpu', product.cpuSeries, item.config.cpu);
        const dimmName = product.dimmSlots > 0 ? resolveOptionName('dimm', null, item.config.dimm) : 'Integrated Memory';
        const lanName = resolveOptionName('lanCard', null, item.config.lanCard);
        const raidName = resolveOptionName('raidCard', null, item.config.raidCard);

        const statusClass = item.status === 'confirmed' ? 'status-confirmed' : 'status-draft';
        const statusLabel = item.status === 'confirmed' ? 'Confirmed' : 'Draft';

        html += `
            <div class="cart-item">
                <div class="cart-item-header">
                    <div class="cart-item-title">
                        <span class="cart-item-name">${item.productId}</span>
                        <span class="cart-item-status ${statusClass}">${statusLabel}</span>
                    </div>
                    <div class="cart-item-actions">
                        ${item.status === 'draft' ? `<button class="cart-action-btn confirm-btn" onclick="confirmCartItem(${index})" title="Confirm">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                        </button>` : ''}
                        <button class="cart-action-btn edit-btn" onclick="editCartItem(${index})" title="Edit">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        </button>
                        <button class="cart-action-btn delete-btn" onclick="removeCartItem(${index})" title="Remove">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="cart-item-base">
                    <span class="result-badge platform">${getLabel(labelMap, 'platform', product.platform)}</span>
                    <span class="result-badge vendor">${getLabel(labelMap, 'vendor', product.vendor)}</span>
                    <span class="result-badge form-factor">${getLabel(labelMap, 'formFactor', product.formFactor)}</span>
                    <span class="result-badge cooling">${getLabel(labelMap, 'cooling', product.cooling)}</span>
                    <span style="font-size:12px; color:#64748b;">${gpuText}</span>
                </div>
                <div class="cart-item-config">
                    <div class="cart-config-row">
                        <span class="cart-config-label">CPU</span>
                        <span class="cart-config-value">${cpuName}</span>
                    </div>
                    <div class="cart-config-row">
                        <span class="cart-config-label">Memory</span>
                        <span class="cart-config-value">${dimmName}</span>
                    </div>
                    <div class="cart-config-row">
                        <span class="cart-config-label">LAN Card</span>
                        <span class="cart-config-value">${lanName}</span>
                    </div>
                    <div class="cart-config-row">
                        <span class="cart-config-label">RAID Card</span>
                        <span class="cart-config-value">${raidName}</span>
                    </div>
                </div>
                <div class="cart-item-time">
                    Last updated: ${new Date(item.timestamp).toLocaleString()}
                </div>
            </div>`;
    });

    html += '</div>';
    content.innerHTML = html;
}

function resolveOptionName(key, cpuSeries, optionId) {
    if (!optionId) return 'Not selected';
    let options;
    if (key === 'cpu') options = cpuOptions[cpuSeries] || [];
    else if (key === 'dimm') options = dimmOptions;
    else if (key === 'lanCard') options = lanCardOptions;
    else if (key === 'raidCard') options = raidCardOptions;
    else return optionId;

    const opt = options.find(o => o.id === optionId);
    return opt ? opt.name : optionId;
}
